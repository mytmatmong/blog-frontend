name: Deploy frontend

# Tự động deploy Angular SSR lên VPS mỗi khi có push vào develop.
# Cùng chiến lược với backend: build image trên GitHub Actions runner,
# chuyển qua VPS bằng scp + docker load, không dùng registry, không build
# trên VPS.
#
# Lưu ý: container frontend nằm trong compose project của repo backend
# (/opt/blog-api/backend/compose.shared.yml — layer "sống lâu dài": nginx,
# postgres, frontend..., xem DEPLOYMENT.md mục 1 ở repo backend), vì cả
# hai chạy chung một VPS đứng sau cùng một Nginx. Workflow này chỉ
# recreate service "frontend", không đụng tới api/postgres/nginx.
#
# QUAN TRỌNG: PHẢI dùng đúng file compose.shared.yml (không phải file
# compose.prod.yml cũ, đã xoá khỏi repo backend ngày 2026-09-04 khi tách
# blue-green — xem backend commit 4d3124e). compose.shared.yml đặt tên
# tường minh cho network ("blog-edge") và container ("blog-frontend");
# compose.prod.yml cũ thì không, nên network "edge" của nó tự suy ra tên
# theo project ("blog-backend-prod_edge") — KHÁC với "blog-edge" mà nginx
# thật đang dùng. Từng dùng nhầm compose.prod.yml ở đây: mỗi lần deploy
# lại recreate frontend vào đúng network sai đó, cắt đứt kết nối tới
# nginx — container tự nó vẫn "healthy" (healthcheck gọi thẳng
# localhost:4000) nên cả job này lẫn job backend đều báo xanh, chỉ có
# nginx không proxy tới được frontend nữa (502 Bad Gateway cho mọi request
# "/", API vẫn bình thường vì api sống ở project blue-green riêng).
#
# Yêu cầu secret cấp ở Settings > Secrets and variables > Actions:
#   DEPLOY_SSH_KEY — cùng private key CI đã cấp cho repo backend (public key
#                    tương ứng đã add vào ~/.ssh/authorized_keys trên VPS).

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  DEPLOY_HOST: 103.72.57.142

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: blog-frontend-runtime:ci
          outputs: type=docker,dest=/tmp/blog-frontend-runtime.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress image
        run: gzip -f /tmp/blog-frontend-runtime.tar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r' phòng trường hợp secret bị dính CRLF khi paste từ Windows
          # (Notepad...) — OpenSSH sẽ báo "error in libcrypto" nếu key có \r.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship image to server
        run: |
          scp -i ~/.ssh/deploy_key /tmp/blog-frontend-runtime.tar.gz "root@${{ env.DEPLOY_HOST }}:/tmp/"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key "root@${{ env.DEPLOY_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail

          gunzip -c /tmp/blog-frontend-runtime.tar.gz | docker load
          rm -f /tmp/blog-frontend-runtime.tar.gz
          docker tag blog-frontend-runtime:ci blog-frontend-runtime:local

          cd /opt/blog-api/backend
          FRONTEND_IMAGE=blog-frontend-runtime:local \
            docker compose --env-file .env.production -f compose.shared.yml up -d --force-recreate frontend

          status="starting"
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' blog-frontend 2>/dev/null || echo starting)
            [ "$status" = healthy ] && break
            sleep 3
          done
          if [ "$status" != healthy ]; then
            echo "frontend container không healthy sau deploy" >&2
            docker logs blog-frontend --tail 50
            exit 1
          fi

          # QUAN TRỌNG: nginx resolve hostname "frontend" trong upstream
          # block MỘT LẦN lúc start/reload, không tự re-resolve theo mỗi
          # request — recreate container "frontend" ở trên cho nó IP mới
          # trên network Docker, nhưng nginx vẫn giữ IP CŨ (đã chết) cho
          # tới khi được reload. Thiếu bước này là lý do site 502 dù
          # container frontend mới đã "healthy" thật. Cùng lý do backend
          # luôn "nginx -s reload" sau mỗi lần switch blue-green
          # (scripts/lib/blue-green-common.sh, repo backend).
          docker exec blog-nginx nginx -t
          docker exec blog-nginx nginx -s reload

          docker image prune -f
          REMOTE

      - name: Smoke test
        # Phải đi qua domain thật + theo redirect (-L), không gọi thẳng IP:80 —
        # gọi thẳng IP:80 chỉ trúng khối redirect 301 sang HTTPS của nginx,
        # "--fail" không coi 3xx là lỗi nên smoke test kiểu đó luôn pass dù
        # frontend phía sau có kết nối được tới nginx hay không (đây chính là
        # lý do lần deploy frontend bị đứt kết nối network với nginx vẫn báo
        # thành công — xem ghi chú ở bước "Deploy on server").
        run: curl --fail --silent --show-error --max-time 10 -L "https://blogy.id.vn/" -o /dev/null
