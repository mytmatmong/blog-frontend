<section class="space-y-6">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="p-5 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm">
      <div class="text-xs text-aquamarine-600 dark:text-aquamarine-400">Blogs chờ xử lý</div>
      <h3 class="font-bold text-2xl text-aquamarine-600 dark:text-aquamarine-400 mt-1">6</h3>
    </div>
    <div class="p-5 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm">
      <div class="text-xs text-aquamarine-600 dark:text-aquamarine-400">Comments bị report</div>
      <h3 class="font-bold text-2xl text-yellow-500 mt-1">14</h3>
    </div>
    <div class="p-5 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm">
      <div class="text-xs text-aquamarine-600 dark:text-aquamarine-400">Categories</div>
      <h3 class="font-bold text-2xl text-aquamarine-950 dark:text-aquamarine-50 mt-1">8</h3>
    </div>
    <div class="p-5 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm">
      <div class="text-xs text-aquamarine-600 dark:text-aquamarine-400">Đã xóa hôm nay</div>
      <h3 class="font-bold text-2xl text-red-500 mt-1">3</h3>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-8">
      <div class="p-5 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm h-full flex flex-col justify-between">
        <h6 class="font-bold text-base text-aquamarine-950 dark:text-aquamarine-50 mb-4">
          Lượng báo cáo vi phạm (7 ngày qua)
        </h6>
        <div>
          <canvas id="reportsChart" height="100"></canvas>
        </div>
      </div>
    </div>

    <div class="lg:col-span-4">
      <div class="p-5 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm h-full">
        <h6 class="font-bold text-base text-aquamarine-950 dark:text-aquamarine-50 mb-4">
          Thao tác nhanh
        </h6>
        <div class="flex flex-col gap-3">
          <a routerLink="/dashboard/moderator/manage-blogs" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm text-white bg-aquamarine-600 hover:bg-aquamarine-700 transition-colors">
            <i class="bi bi-journal-check"></i>Duyệt Blogs (6)
          </a>
          <a routerLink="/dashboard/moderator/manage-comments" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm text-white bg-aquamarine-600 hover:bg-aquamarine-700 transition-colors">
            <i class="bi bi-chat-right-dots"></i>Xử lý Comments (14)
          </a>
          <a routerLink="/dashboard/moderator/manage-categories" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm text-aquamarine-800 dark:text-aquamarine-200 border border-aquamarine-300 dark:border-aquamarine-700 hover:bg-aquamarine-50 dark:hover:bg-aquamarine-800 transition-colors">
            <i class="bi bi-folder-plus"></i>Thêm Category
          </a>
          <a href="#" (click)="$event.preventDefault()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors">
            <i class="bi bi-trash3"></i>Xem lịch sử xóa
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-4">
      <div class="p-5 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm">
        <h6 class="font-bold text-base text-aquamarine-950 dark:text-aquamarine-50 mb-4">
          Tỷ lệ xử lý vi phạm
        </h6>
        <div>
          <canvas id="moderationPieChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</section>
