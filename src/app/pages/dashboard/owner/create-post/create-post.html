<section class="space-y-6">
  <div class="p-6 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm">
    <h3 class="font-bold text-xl text-aquamarine-950 dark:text-aquamarine-50 mb-6">Tạo bài viết</h3>
    
    <form (submit)="$event.preventDefault()" class="space-y-6">
      <div class="flex flex-wrap justify-between items-center gap-4 pb-4 border-b border-aquamarine-200 dark:border-aquamarine-800">
        <div class="inline-flex rounded-xl bg-aquamarine-50 dark:bg-aquamarine-950 p-1">
          <button type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all" [class.bg-aquamarine-600]="currentEditLang() === 'VI'" [class.text-white]="currentEditLang() === 'VI'" [class.text-aquamarine-800]="currentEditLang() !== 'VI'" [class.dark:text-aquamarine-200]="currentEditLang() !== 'VI'" (click)="changeEditLang('VI')">
            <img src="https://flagcdn.com/w20/vn.png" alt="VN" class="w-4 h-3 rounded-sm object-cover"> Tiếng Việt 
            <span class="px-1.5 py-0.5 rounded text-[10px]" [class.bg-aquamarine-700]="currentEditLang() === 'VI'" [class.bg-aquamarine-200]="currentEditLang() !== 'VI'" [class.dark:bg-aquamarine-800]="currentEditLang() !== 'VI'">
              {{ originalLanguage() === 'VI' ? 'Gốc' : 'Dịch' }}
            </span>
          </button>

          <button type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all" [class.bg-aquamarine-600]="currentEditLang() === 'EN'" [class.text-white]="currentEditLang() === 'EN'" [class.text-aquamarine-800]="currentEditLang() !== 'EN'" [class.dark:text-aquamarine-200]="currentEditLang() !== 'EN'" (click)="changeEditLang('EN')">
            <img src="https://flagcdn.com/w20/gb.png" alt="EN" class="w-4 h-3 rounded-sm object-cover"> Tiếng Anh 
            <span class="px-1.5 py-0.5 rounded text-[10px]" [class.bg-aquamarine-700]="currentEditLang() === 'EN'" [class.bg-aquamarine-200]="currentEditLang() !== 'EN'" [class.dark:bg-aquamarine-800]="currentEditLang() !== 'EN'">
              {{ originalLanguage() === 'EN' ? 'Gốc' : 'Dịch' }}
            </span>
          </button>
        </div>

        <div class="flex items-center gap-2">
          <label class="text-xs text-aquamarine-600 dark:text-aquamarine-400">Ngôn ngữ gốc:</label>
          <select [value]="originalLanguage()" (change)="changeOriginalLanguage($any($event.target).value)" class="text-xs rounded-lg border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 px-3 py-1.5 text-aquamarine-900 dark:text-aquamarine-100 outline-none">
            <option value="VI">Tiếng Việt</option>
            <option value="EN">Tiếng Anh</option>
          </select>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-aquamarine-700 dark:text-aquamarine-300 mb-1">Tiêu đề (<span>{{ currentEditLang() }}</span>) <span class="text-red-500">*</span></label>
          <input type="text" [(ngModel)]="titleModel" name="title" class="w-full rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-aquamarine-50/50 dark:bg-aquamarine-950 px-4 py-2.5 text-sm text-aquamarine-950 dark:text-aquamarine-50 placeholder-aquamarine-400 focus:outline-none focus:ring-2 focus:ring-aquamarine-500" placeholder="Nhập tiêu đề..." required>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-aquamarine-700 dark:text-aquamarine-300 mb-1">Danh mục</label>
            <div class="rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-aquamarine-50/50 dark:bg-aquamarine-950 p-3 h-28 overflow-y-auto space-y-2">
              @for (cat of categories; track cat.id) {
                <label class="flex items-center gap-2 text-xs text-aquamarine-900 dark:text-aquamarine-100 cursor-pointer">
                  <input type="checkbox" [(ngModel)]="cat.checked" [name]="cat.id" [id]="cat.id" class="rounded border-aquamarine-300 text-aquamarine-600 focus:ring-aquamarine-500">
                  <span>{{ cat.label }}</span>
                </label>
              }
            </div>
            <small class="text-xs text-aquamarine-600 dark:text-aquamarine-400 mt-1 block">Tích chọn các danh mục phù hợp</small>
          </div>
          
          <div>
            <label class="block text-xs font-semibold text-aquamarine-700 dark:text-aquamarine-300 mb-1">Hashtags</label>
            <input type="text" [(ngModel)]="hashtags" name="hashtags" class="w-full rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-aquamarine-50/50 dark:bg-aquamarine-950 px-4 py-2.5 text-sm text-aquamarine-950 dark:text-aquamarine-50 placeholder-aquamarine-400 focus:outline-none focus:ring-2 focus:ring-aquamarine-500" placeholder="#tag1 #tag2">
          </div>
          
          <div>
            <label class="block text-xs font-semibold text-aquamarine-700 dark:text-aquamarine-300 mb-1">Ảnh bìa (Thumbnail)</label>
            <input type="file" class="w-full rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-aquamarine-50/50 dark:bg-aquamarine-950 px-3 py-2 text-xs text-aquamarine-950 dark:text-aquamarine-50 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-aquamarine-200 file:text-aquamarine-800 hover:file:bg-aquamarine-300" accept="image/*">
            <small class="text-xs text-aquamarine-600 dark:text-aquamarine-400 mt-1 block">Hỗ trợ JPG, PNG, GIF...</small>
          </div>

          <div>
            <label class="block text-xs font-semibold text-aquamarine-700 dark:text-aquamarine-300 mb-1">Video đính kèm (Tùy chọn)</label>
            <input type="file" class="w-full rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-aquamarine-50/50 dark:bg-aquamarine-950 px-3 py-2 text-xs text-aquamarine-950 dark:text-aquamarine-50 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-aquamarine-200 file:text-aquamarine-800 hover:file:bg-aquamarine-300" accept="video/mp4,video/webm,video/ogg">
            <small class="text-xs text-aquamarine-600 dark:text-aquamarine-400 mt-1 block">Hỗ trợ MP4, WebM (Tối đa 50MB)</small>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-aquamarine-700 dark:text-aquamarine-300 mb-1">Content <span class="text-red-500">*</span></label>
          <div class="rounded-xl overflow-hidden border border-aquamarine-200 dark:border-aquamarine-800">
            <div id="editor-container" class="h-80 bg-white dark:bg-aquamarine-950 text-aquamarine-950 dark:text-aquamarine-50"></div>
          </div>
        </div>
      </div>
      
      <div class="flex gap-3 pt-4 border-t border-aquamarine-200 dark:border-aquamarine-800">
        <button type="button" (click)="handleSave('PUBLISHED')" class="px-6 py-2.5 rounded-xl font-semibold text-sm text-white bg-aquamarine-600 hover:bg-aquamarine-700 transition-colors flex items-center gap-2">
          <i class="bi bi-send"></i> Xuất bản
        </button>
        <button type="button" (click)="handleSave('DRAFT')" class="px-6 py-2.5 rounded-xl font-semibold text-sm text-aquamarine-800 dark:text-aquamarine-200 border border-aquamarine-300 dark:border-aquamarine-700 hover:bg-aquamarine-50 dark:hover:bg-aquamarine-800 transition-colors flex items-center gap-2">
          <i class="bi bi-save"></i> Lưu nháp
        </button>
      </div>
    </form>
  </div>
</section>

<!-- Toast Container -->
@if (showToast()) {
  <div class="fixed bottom-5 right-5 z-50 transition-all transform">
    <div class="px-4 py-3 rounded-xl shadow-lg flex items-center justify-between gap-4 text-white text-sm" [class.bg-emerald-600]="toastType() === 'success'" [class.bg-red-600]="toastType() === 'danger'" [class.bg-gray-700]="toastType() === 'secondary'">
      <span>{{ toastMsg() }}</span>
      <button type="button" (click)="showToast.set(false)" class="text-white hover:opacity-80">
        <i class="bi bi-x-lg text-sm"></i>
      </button>
    </div>
  </div>
}
