<div class="flex justify-center items-center min-h-screen bg-aquamarine-50/50 dark:bg-aquamarine-950 p-4">
  <div class="w-full max-w-md p-6 lg:p-8 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm">
    <h4 class="font-bold text-xl text-center text-aquamarine-950 dark:text-aquamarine-50 mb-6">{{ 'dashboard_auth.title' | translate }}</h4>
    <form (submit)="onSubmit($event)" class="space-y-4">
      <div>
        <input type="text" [ngModel]="identifier()" (ngModelChange)="identifier.set($event)" name="identifier" class="w-full rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-aquamarine-50/50 dark:bg-aquamarine-950 px-4 py-2.5 text-sm text-aquamarine-950 dark:text-aquamarine-50 placeholder-aquamarine-400 focus:outline-none focus:ring-2 focus:ring-aquamarine-500" [placeholder]="'dashboard_auth.identifier_placeholder' | translate" required>
      </div>
      <div>
        <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" class="w-full rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-aquamarine-50/50 dark:bg-aquamarine-950 px-4 py-2.5 text-sm text-aquamarine-950 dark:text-aquamarine-50 placeholder-aquamarine-400 focus:outline-none focus:ring-2 focus:ring-aquamarine-500" [placeholder]="'auth.password_placeholder' | translate" required>
      </div>
      <button type="submit" [disabled]="isLoading()" class="w-full py-2.5 font-semibold text-sm text-white bg-aquamarine-600 hover:bg-aquamarine-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl transition-colors flex items-center justify-center gap-2">
        @if (isLoading()) {
          <span class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
        }
        {{ 'dashboard_auth.submit_btn' | translate }}
      </button>
    </form>
  </div>
</div>
