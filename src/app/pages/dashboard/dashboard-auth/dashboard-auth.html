<!-- dashboard-auth-page -->
<div class="flex justify-center items-center min-h-screen bg-[var(--card-bg-muted,#f8fafc)] p-4">
  <!-- dashboard-auth-card -->
  <div class="w-full max-w-md p-6 lg:p-8 rounded-2xl border border-[var(--border-color)] bg-[var(--card-bg)] shadow-sm">
    <!-- dashboard-auth-title -->
    <h4 class="font-bold text-xl text-center text-[var(--card-text-default)] mb-6">{{ 'dashboard_auth.title' | translate }}</h4>

    <form (submit)="onSubmit($event)" class="space-y-4">
      <div>
        <input type="text" [ngModel]="identifier()" (ngModelChange)="identifier.set($event)" name="identifier" class="w-full rounded-xl border border-[var(--border-color)] bg-[var(--card-bg-muted)] px-4 py-2.5 text-sm text-[var(--card-text-default)] placeholder:text-[var(--text-faint)] focus:outline-none focus:border-[var(--brand)] focus:ring-2 focus:ring-[color-mix(in_srgb,var(--brand)_15%,transparent)]" [placeholder]="'dashboard_auth.identifier_placeholder' | translate" required>
      </div>
      <div>
        <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" class="w-full rounded-xl border border-[var(--border-color)] bg-[var(--card-bg-muted)] px-4 py-2.5 text-sm text-[var(--card-text-default)] placeholder:text-[var(--text-faint)] focus:outline-none focus:border-[var(--brand)] focus:ring-2 focus:ring-[color-mix(in_srgb,var(--brand)_15%,transparent)]" [placeholder]="'auth.password_placeholder' | translate" required>
      </div>
      <button type="submit" [disabled]="isLoading()" class="w-full py-2.5 font-semibold text-sm text-white bg-[var(--brand)] hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl transition-all flex items-center justify-center gap-2">
        @if (isLoading()) {
        <span class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
        }
        {{ 'dashboard_auth.submit_btn' | translate }}
      </button>
    </form>
  </div>
</div>
