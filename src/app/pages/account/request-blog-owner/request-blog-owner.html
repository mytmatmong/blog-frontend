<main class="container mx-auto px-4 max-w-7xl py-12 flex justify-center">
  <div class="w-full max-w-xl p-6 lg:p-8 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm">
    <h4 class="font-bold text-xl text-aquamarine-950 dark:text-aquamarine-50 mb-2">{{ 'request_owner.title' | translate }}</h4>
    <p class="text-xs text-aquamarine-600 dark:text-aquamarine-400 mb-6">{{ 'request_owner.subtitle' | translate }}</p>
    <form class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-aquamarine-700 dark:text-aquamarine-300 mb-1">{{ 'request_owner.reason_label' | translate }}</label>
        <textarea class="w-full rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-aquamarine-50/50 dark:bg-aquamarine-950 p-3 text-sm text-aquamarine-950 dark:text-aquamarine-50 placeholder-aquamarine-400 focus:outline-none focus:ring-2 focus:ring-aquamarine-500" rows="4" [placeholder]="ts.translate('request_owner.reason_placeholder')"></textarea>
      </div>
      <button type="submit" class="w-full py-2.5 font-semibold text-sm text-white bg-aquamarine-600 hover:bg-aquamarine-700 rounded-xl transition-colors">{{ 'request_owner.submit_btn' | translate }}</button>
    </form>
  </div>
</main>
