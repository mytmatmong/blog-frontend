<main class="container-xl py-5 flex-grow-1">
  <div class="auth-card card soft-card">
    <div class="card-body p-4">
      <ul class="nav nav-pills nav-fill mb-4" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login">Login</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#register">Register</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#forgot">Forgot</button>
        </li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="login">
          <h4 class="fw-bold mb-3 text-center">Đăng nhập</h4>
          <form id="loginForm">
            <input class="form-control mb-3" type="email" placeholder="Email" required>
            <input class="form-control mb-3" type="password" placeholder="Mật khẩu" required>
            <button type="submit" class="btn btn-primary w-100">Đăng nhập demo</button>
          </form>
        </div>
        
        <div class="tab-pane fade" id="register">
          <h4 class="fw-bold mb-3 text-center">Đăng ký</h4>
          <form id="registerForm">
            <input class="form-control mb-3" type="text" placeholder="Username" required>
            <input class="form-control mb-3" type="email" placeholder="Email" required>
            <input class="form-control mb-3" type="password" placeholder="Mật khẩu" required>
            <button type="submit" class="btn btn-primary w-100">Tạo tài khoản</button>
          </form>
        </div>

        <div class="tab-pane fade" id="forgot">
          <h4 class="fw-bold mb-3 text-center">Khôi phục mật khẩu</h4>
          <form id="forgotForm">
            <input class="form-control mb-3" type="email" placeholder="Email" required>
            <button type="submit" class="btn btn-primary w-100">Gửi link khôi phục</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
