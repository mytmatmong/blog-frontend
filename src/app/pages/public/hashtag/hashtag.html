<main class="container mx-auto px-4 max-w-7xl py-6">
  <!-- Page Header -->
  <section class="p-6 mb-6 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 card-box shadow-sm">
    <h3 class="font-bold text-2xl text-aquamarine-950 dark:text-aquamarine-50 mb-2">#Hashtag bài viết</h3>
    <p class="text-sm text-aquamarine-600 dark:text-aquamarine-400">Tìm kiếm các bài viết nổi bật được đánh tag tương ứng.</p>
  </section>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <app-public-sidebar-left 
      class="hidden lg:block lg:col-span-3"
      [activeFilter]="activeFilter()"
      (filterChange)="activeFilter.set($event); currentPage.set(1)"
      [searchTerm]="searchTerm()"
      (searchChange)="searchTerm.set($event); currentPage.set(1)">
    </app-public-sidebar-left>
    
    <section class="lg:col-span-6">
      @for (post of visiblePosts(); track post.id) {
        <app-post-card [post]="post"></app-post-card>
      }
      <app-pagination 
        [totalItems]="filteredPosts().length" 
        [itemsPerPage]="itemsPerPage" 
        [(currentPage)]="currentPage">
      </app-pagination>
    </section>

    <app-public-sidebar-right class="lg:col-span-3"></app-public-sidebar-right>
  </div>
</main>
