<div class="relative inline-block text-left min-w-max">
  <!-- DISPLAY MODE -->
  @if (mode() === 'display') {
    <span class="inline-flex items-center gap-2 font-medium rounded-full cursor-default"
          [class.px-2.5]="size() === 'sm'" [class.py-1]="size() === 'sm'" [class.text-xs]="size() === 'sm'"
          [class.px-3]="size() === 'md'" [class.py-1.5]="size() === 'md'" [class.text-sm]="size() === 'md'"
          class="bg-aquamarine-50 dark:bg-aquamarine-900/50 text-aquamarine-800 dark:text-aquamarine-200 border border-aquamarine-200 dark:border-aquamarine-800">
      <img [src]="getFlagUrl(activeOption()?.flag || activeOption()?.code || value())" class="w-5 h-3.5 rounded-sm object-cover shrink-0 shadow-2xs" alt="Flag">
      <span class="truncate">{{ activeOption()?.name || activeOption()?.code || value() }}</span>
      @if (!hideCode() && activeOption()) {
        <span class="font-mono text-[0.85em] opacity-70">({{ activeOption()?.code }})</span>
      }
    </span>
  } @else {
    <!-- SELECT / SYSTEM MODE (BUTTON) -->
    <button
      type="button"
      (click)="toggleOpen()"
      [disabled]="disabled()"
      class="inline-flex items-center justify-between gap-2 font-medium rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-950 text-aquamarine-950 dark:text-aquamarine-50 shadow-2xs hover:border-aquamarine-300 dark:hover:border-aquamarine-700 focus:outline-none focus:ring-2 focus:ring-aquamarine-500 transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed w-full"
      [class.px-3]="size() === 'sm'" [class.py-1.5]="size() === 'sm'" [class.text-xs]="size() === 'sm'"
      [class.px-3.5]="size() === 'md'" [class.py-2]="size() === 'md'" [class.text-sm]="size() === 'md'"
    >
      <span class="flex items-center gap-2 truncate whitespace-nowrap">
        <img [src]="getFlagUrl(activeOption()?.flag || activeOption()?.code || value())" class="w-5 h-3.5 rounded-sm object-cover shrink-0 shadow-2xs" alt="Flag">
        <span class="truncate">{{ activeOption()?.name || activeOption()?.code || value() || ('dropdown.select_single' | translate) }}</span>
        @if (!hideCode() && activeOption()) {
          <span class="font-mono text-[0.85em] opacity-70">({{ activeOption()?.code }})</span>
        }
      </span>

      <i
        class="bi bi-chevron-down text-aquamarine-500 transition-transform duration-200 shrink-0"
        [class.text-[10px]]="size() === 'sm'" [class.text-xs]="size() === 'md'"
        [class.rotate-180]="isOpen()"
      ></i>
    </button>

    <!-- DROPDOWN POPOVER -->
    @if (isOpen()) {
      <div
        class="absolute right-0 top-full mt-1.5 z-50 min-w-full w-max max-w-[280px] max-h-60 overflow-y-auto rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-xl p-1.5 space-y-0.5 backdrop-blur-md"
      >
        @for (opt of availableOptions(); track opt.code) {
          <button
            type="button"
            (click)="selectOption(opt)"
            class="w-full px-3 py-2 text-left font-medium rounded-lg flex items-center justify-between transition-colors cursor-pointer gap-3"
            [class.text-xs]="size() === 'sm'" [class.text-sm]="size() === 'md'"
            [class.bg-aquamarine-600]="activeOption()?.code === opt.code"
            [class.text-white]="activeOption()?.code === opt.code"
            [class.text-aquamarine-950]="activeOption()?.code !== opt.code"
            [class.dark:text-aquamarine-50]="activeOption()?.code !== opt.code"
            [class.hover:bg-aquamarine-50]="activeOption()?.code !== opt.code"
            [class.dark:hover:bg-aquamarine-800]="activeOption()?.code !== opt.code"
          >
            <span class="flex items-center gap-2.5 truncate whitespace-nowrap">
              <img [src]="getFlagUrl(opt.flag || opt.code)" class="w-5 h-3.5 rounded-sm object-cover shrink-0 shadow-2xs" alt="Flag">
              <span class="truncate">{{ opt.name }}</span>
              @if (!hideCode()) {
                <span class="font-mono text-[0.85em] opacity-70">({{ opt.code }})</span>
              }
            </span>

            @if (activeOption()?.code === opt.code) {
              <i class="bi bi-check2 font-bold shrink-0 text-sm"></i>
            }
          </button>
        }
      </div>
    }
  }
</div>
