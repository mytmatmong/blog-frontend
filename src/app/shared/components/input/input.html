<div class="w-full space-y-1.5">
  @if (label) {
    <label [for]="id" class="block text-xs font-semibold text-aquamarine-900 dark:text-aquamarine-100">
      {{ label }}
      @if (required) {
        <span class="text-red-500 ms-0.5">*</span>
      }
    </label>
  }

  <div class="relative flex items-center">
    @if (icon) {
      <div class="absolute left-3.5 flex items-center justify-center text-aquamarine-600 dark:text-aquamarine-400 pointer-events-none">
        <i [class]="icon"></i>
      </div>
    }

    <input
      [id]="id"
      [type]="inputType"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      [required]="required"
      (input)="onInput($event)"
      (focus)="onFocus($event)"
      (blur)="onBlur($event)"
      class="app-input-field w-full rounded-xl border transition-all duration-200 outline-none text-sm px-3.5 py-2.5"
      [class.ps-10]="icon"
      [class.pe-10]="type === 'password'"
      [class.border-red-500]="errorMessage"
    />

    @if (type === 'password') {
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        class="absolute right-3 flex items-center justify-center text-aquamarine-600 dark:text-aquamarine-400 hover:text-aquamarine-800 dark:hover:text-aquamarine-200 transition-colors p-1"
        tabindex="-1">
        <i [class]="showPassword() ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill'"></i>
      </button>
    }
  </div>

  @if (errorMessage) {
    <p class="text-xs text-red-500 mt-1 flex items-center gap-1">
      <i class="bi bi-exclamation-circle"></i> {{ errorMessage }}
    </p>
  } @else if (hint) {
    <p class="text-xs text-aquamarine-600 dark:text-aquamarine-400 mt-1">{{ hint }}</p>
  }
</div>
