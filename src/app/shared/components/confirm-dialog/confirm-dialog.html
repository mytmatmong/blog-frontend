<div
  class="fixed inset-0 z-60 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm"
  role="presentation"
  (click)="!busy() && cancelled.emit()"
>
  <div
    class="w-full max-w-md rounded-2xl border border-aquamarine-200 bg-white p-6 shadow-xl dark:border-aquamarine-800 dark:bg-aquamarine-900"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-start gap-4">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl" [class]="accentClass()">
        <i class="bi text-lg" [class]="icon()"></i>
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-start justify-between gap-4">
          <h2 class="text-lg font-bold text-aquamarine-950 dark:text-aquamarine-50">{{ title() }}</h2>
          <button
            type="button"
            class="text-gray-400 transition-colors hover:text-gray-600 disabled:opacity-50 dark:hover:text-gray-200"
            [disabled]="busy()"
            (click)="cancelled.emit()"
          >
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <p class="mt-2 text-sm leading-6 text-aquamarine-700 dark:text-aquamarine-300">{{ message() }}</p>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        class="rounded-xl border border-aquamarine-300 px-4 py-2 text-sm font-medium text-aquamarine-800 transition-colors hover:bg-aquamarine-50 disabled:opacity-50 dark:border-aquamarine-700 dark:text-aquamarine-200 dark:hover:bg-aquamarine-800 whitespace-nowrap shrink-0"
        [disabled]="busy()"
        (click)="cancelled.emit()"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        class="flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold text-white transition-colors disabled:opacity-50 whitespace-nowrap shrink-0"
        [class]="buttonClass()"
        [disabled]="busy()"
        (click)="confirmed.emit()"
      >
        @if (busy()) {
          <i class="bi bi-arrow-repeat animate-spin"></i>
        }
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
