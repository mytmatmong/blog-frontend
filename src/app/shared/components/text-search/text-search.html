<div class="relative flex-1 min-w-[220px]">
  <!-- Icon Tìm kiếm -->
  <i
    class="bi bi-search absolute left-3.5 top-1/2 -translate-y-1/2 text-aquamarine-500 dark:text-aquamarine-400 pointer-events-none"
    [class.text-xs]="size() === 'sm'"
    [class.text-sm]="size() === 'md'"
  ></i>

  <!-- Ô nhập từ khóa -->
  <input
    type="text"
    [ngModel]="value()"
    (ngModelChange)="onInput($event)"
    (keyup.enter)="onKeyDownEnter()"
    [placeholder]="displayPlaceholder()"
    [disabled]="disabled()"
    class="w-full pl-10 pr-8 rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-aquamarine-50/50 dark:bg-aquamarine-950/60 text-aquamarine-950 dark:text-aquamarine-50 placeholder-aquamarine-400 focus:outline-none focus:ring-2 focus:ring-aquamarine-500 focus:border-transparent transition-all disabled:opacity-50 disabled:cursor-not-allowed"
    [class.py-1.5]="size() === 'sm'"
    [class.text-xs]="size() === 'sm'"
    [class.py-2]="size() === 'md'"
    [class.text-sm]="size() === 'md'"
  />

  <!-- Nút Xóa từ khóa nhanh -->
  @if (value() && !disabled()) {
    <button
      type="button"
      (click)="clearSearch()"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-aquamarine-400 hover:text-aquamarine-600 dark:hover:text-aquamarine-200 transition-colors cursor-pointer"
      [title]="'common.clear_search' | translate"
    >
      <i class="bi bi-x-circle-fill text-xs"></i>
    </button>
  }
</div>
