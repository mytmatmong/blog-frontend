<div class="space-y-4">
  @if (showFilters) {
  <div
    class="p-4 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm">
    <h6
      class="font-bold text-xs uppercase tracking-wider text-aquamarine-600 dark:text-aquamarine-400 mb-3 flex items-center gap-1.5">
      <i class="bi bi-funnel-fill" aria-hidden="true"></i>

      {{
      'sidebar.filter_title'
      | translate
      }}
    </h6>

    <div class="space-y-1">
      @for (
      option of filterOptions;
      track option.key
      ) {
      <button type="button"
        class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium transition-all text-left"
        [class.!bg-aquamarine-600]="
              activeFilter === option.key
            " [class.!text-white]="
              activeFilter === option.key
            " [class.dark:!bg-aquamarine-400]="
              activeFilter === option.key
            " [class.dark:!text-black]="
              activeFilter === option.key
            " [class.font-semibold]="
              activeFilter === option.key
            " [class.shadow-sm]="
              activeFilter === option.key
            " [class.text-aquamarine-800]="
              activeFilter !== option.key
            " [class.dark:text-aquamarine-200]="
              activeFilter !== option.key
            " [class.hover:bg-aquamarine-50]="
              activeFilter !== option.key
            " [class.dark:hover:bg-aquamarine-950/60]="
              activeFilter !== option.key
            " (click)="
              selectFilter(option.key)
            ">
        <i [class]="option.icon" class="text-sm" aria-hidden="true"></i>

        <span>
          {{
          option.translationKey
          | translate
          }}
        </span>
      </button>
      }
    </div>
  </div>
  }

  <div
    class="p-4 rounded-2xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-sm">
    <h6
      class="font-bold text-xs uppercase tracking-wider text-aquamarine-600 dark:text-aquamarine-400 mb-3 flex items-center gap-1.5">
      <i class="bi bi-search" aria-hidden="true"></i>

      {{
      'sidebar.search_title'
      | translate
      }}
    </h6>

    <app-input type="text" icon="bi bi-search" [placeholder]="computedPlaceholder" [value]="searchTerm"
      (valueChange)="onSearch($event)">
    </app-input>
  </div>
</div>
