<!-- sidebar-stack -->
<div class="grid gap-[12px]">
  <!-- sidebar-card sidebar-filter-card -->
  <section class="sidebar-card overflow-hidden rounded-[14px]">
    @if (showFilters) {
    <!-- sidebar-card__header -->
    <div class="flex items-center justify-between gap-[10px] pt-[17px] px-[15px] pb-[10px]">
      <!-- sidebar-card__title -->
      <h2 class="flex items-center gap-2 m-0 text-[var(--card-text-default)] text-[13.5px] font-[800] leading-[1.3] tracking-[-0.01em] normal-case">
        <i class="bi bi-funnel-fill text-[var(--brand)] text-[12px]"></i>
        {{ 'sidebar.filter_title' | translate }}
      </h2>
    </div>

    <!-- sidebar-card__body -->
    <div class="pt-[3px] px-[9px] pb-[11px]">
      <!-- filter-list -->
      <div class="grid gap-1">
        @for (option of filterOptions; track option.key) {
        <!-- filter-button -->
        <button
          type="button"
          class="w-full min-h-[39px] flex items-center gap-[9px] px-[9px] py-[7px] border border-transparent rounded-[10px] bg-transparent text-[var(--text-muted)] hover:text-[var(--card-text-default)] hover:bg-[var(--card-bg-muted)] text-[13px] font-[650] text-left cursor-pointer transition-all duration-150"
          [ngClass]="activeFilter === option.key ? '!text-white !border-[var(--brand)] !bg-[linear-gradient(135deg,color-mix(in_srgb,var(--brand)_94%,#ffffff),var(--brand))] !shadow-[0_7px_16px_color-mix(in_srgb,var(--brand)_20%,transparent)]' : ''"
          (click)="selectFilter(option.key)">
          <!-- filter-button__icon -->
          <span
            class="w-[22px] h-[22px] grid place-items-center shrink-0 rounded-[7px] bg-[color-mix(in_srgb,var(--card-bg-muted)_76%,transparent)]"
            [ngClass]="activeFilter === option.key ? '!bg-white/16' : ''">
            <i [class]="option.icon"></i>
          </span>

          <!-- filter-button__label -->
          <span class="min-w-0 flex-1">
            {{ option.translationKey | translate }}
          </span>

          @if (activeFilter === option.key) {
          <!-- filter-button__check -->
          <i class="bi bi-check2 shrink-0 text-[13px]"></i>
          }
        </button>
        }
      </div>
    </div>
    }

    <!-- sidebar-search -->
    <div
      class="p-4 border-t border-[var(--border-color)] bg-transparent"
      [ngClass]="!showFilters ? '!border-t-0' : ''">
      <!-- sidebar-search__label -->
      <div class="flex items-center gap-2 m-0 mb-3 text-[var(--card-text-default)] text-[14px] font-[800] leading-[1.3] tracking-[-0.01em] normal-case">
        <i class="bi bi-search text-[var(--brand)] text-[14px]"></i>
        {{ 'sidebar.search_title' | translate }}
      </div>

      <app-input
        type="text"
        icon="bi bi-search"
        [placeholder]="computedPlaceholder"
        [value]="searchTerm"
        (valueChange)="onSearch($event)">
      </app-input>
    </div>
  </section>
</div>
