<div class="sidebar-stack">
  <section class="sidebar-card sidebar-filter-card">
    @if (showFilters) {
    <div class="sidebar-card__header">
      <h2 class="sidebar-card__title">
        <i class="bi bi-funnel-fill"></i>
        {{ 'sidebar.filter_title' | translate }}
      </h2>
    </div>

    <div class="sidebar-card__body">
      <div class="filter-list">
        @for (option of filterOptions; track option.key) {
        <button type="button" class="filter-button" [class.is-active]="activeFilter === option.key"
          (click)="selectFilter(option.key)">
          <span class="filter-button__icon">
            <i [class]="option.icon"></i>
          </span>

          <span class="filter-button__label">
            {{ option.translationKey | translate }}
          </span>

          @if (activeFilter === option.key) {
          <i class="bi bi-check2 filter-button__check"></i>
          }
        </button>
        }
      </div>
    </div>
    }

    <div class="sidebar-search" [class.sidebar-search--standalone]="!showFilters">
      <div class="sidebar-search__label">
        <i class="bi bi-search"></i>
        {{ 'sidebar.search_title' | translate }}
      </div>

      <app-input type="text" icon="bi bi-search" [placeholder]="computedPlaceholder" [value]="searchTerm"
        (valueChange)="onSearch($event)">
      </app-input>
    </div>
  </section>
</div>
