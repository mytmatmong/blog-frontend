<div class="relative inline-block text-left" [class]="minWidth()">
  <!-- Label bên trên/bên cạnh nếu có -->
  @if (label()) {
    <label class="block text-xs font-semibold text-aquamarine-700 dark:text-aquamarine-300 mb-1">
      {{ label() }}
    </label>
  }

  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggleOpen()"
    [disabled]="disabled()"
    class="w-full px-3.5 py-2 rounded-xl text-sm border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-950 text-aquamarine-950 dark:text-aquamarine-50 flex items-center justify-between gap-2 shadow-2xs hover:border-aquamarine-300 dark:hover:border-aquamarine-700 focus:outline-none focus:ring-2 focus:ring-aquamarine-500 transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
  >
    <span class="truncate font-medium flex items-center gap-2 whitespace-nowrap">
      @if (selectedOption()?.icon) {
        <i [class]="selectedOption()?.icon"></i>
      }
      {{ selectedOption() ? selectedOption()?.label : displayPlaceholder() }}
    </span>

    <i
      class="bi bi-chevron-down text-xs text-aquamarine-500 transition-transform duration-200 shrink-0"
      [class.rotate-180]="isOpen()"
    ></i>
  </button>

  <!-- Dropdown Menu Popover -->
  @if (isOpen()) {
    <div
      class="absolute right-0 left-0 mt-1.5 z-50 max-h-60 min-w-full w-max max-w-[360px] overflow-y-auto rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-aquamarine-900 shadow-xl p-1.5 space-y-0.5 backdrop-blur-md"
    >
      @for (opt of options(); track opt.value) {
        <button
          type="button"
          (click)="selectOption(opt)"
          class="w-full px-3 py-2 text-left text-sm font-medium rounded-lg flex items-center justify-between transition-colors cursor-pointer gap-2"
          [class.bg-aquamarine-600]="value() === opt.value"
          [class.text-white]="value() === opt.value"
          [class.text-aquamarine-950]="value() !== opt.value"
          [class.dark:text-aquamarine-50]="value() !== opt.value"
          [class.hover:bg-aquamarine-50]="value() !== opt.value"
          [class.dark:hover:bg-aquamarine-800]="value() !== opt.value"
        >
          <span class="flex items-center gap-2 truncate whitespace-nowrap">
            @if (opt.icon) {
              <i [class]="opt.icon"></i>
            }
            {{ opt.label }}
          </span>

          @if (value() === opt.value) {
            <i class="bi bi-check2 text-sm font-bold shrink-0"></i>
          }
        </button>
      }
    </div>
  }
</div>
