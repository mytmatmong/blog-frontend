<nav class="mt-6 flex justify-center" aria-label="Page navigation">
  <ul class="inline-flex items-center space-x-1 text-sm">
    <li>
      <button 
        class="px-3 py-2 rounded-lg border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-black text-aquamarine-800 dark:text-aquamarine-200 hover:bg-aquamarine-50 dark:hover:bg-aquamarine-900 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
        [disabled]="currentPage() === 1"
        (click)="goToPage(currentPage() - 1)"
        type="button">
        {{ 'pagination.prev' | translate }}
      </button>
    </li>
    
    @for (p of pages(); track p) {
      <li>
        <button 
          class="px-3.5 py-2 rounded-lg font-semibold transition-colors"
          [class.bg-aquamarine-600]="currentPage() === p"
          [class.text-white]="currentPage() === p"
          [class.border]="currentPage() !== p"
          [class.border-aquamarine-200]="currentPage() !== p"
          [class.dark:border-aquamarine-800]="currentPage() !== p"
          [class.bg-white]="currentPage() !== p"
          [class.dark:bg-black]="currentPage() !== p"
          [class.text-aquamarine-800]="currentPage() !== p"
          [class.dark:text-aquamarine-200]="currentPage() !== p"
          [class.hover:bg-aquamarine-50]="currentPage() !== p"
          [class.dark:hover:bg-aquamarine-800]="currentPage() !== p"
          (click)="goToPage(p)"
          type="button">
          {{ p }}
        </button>
      </li>
    }
    
    <li>
      <button 
        class="px-3 py-2 rounded-lg border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-black text-aquamarine-800 dark:text-aquamarine-200 hover:bg-aquamarine-50 dark:hover:bg-aquamarine-900 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
        [disabled]="currentPage() === totalPages()"
        (click)="goToPage(currentPage() + 1)"
        type="button">
        {{ 'pagination.next' | translate }}
      </button>
    </li>
  </ul>
</nav>
