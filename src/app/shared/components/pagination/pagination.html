<nav class="mt-6" aria-label="Điều hướng phân trang">
  <div class="flex flex-col items-center justify-center gap-3">
    <!-- Thông tin trang hiện tại -->
    <p class="text-xs text-aquamarine-600 dark:text-aquamarine-400">
      Trang
      <strong>
        {{ normalizedCurrentPage() }}
      </strong>
      /
      <strong>
        {{ totalPages() }}
      </strong>
    </p>

    <div class="max-w-full overflow-x-auto pb-1">
      <ul class="inline-flex items-center gap-1 text-sm whitespace-nowrap">
        <!-- Trang trước -->
        <li>
          <button type="button"
            class="min-h-10 px-3 py-2 rounded-lg border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-black text-aquamarine-800 dark:text-aquamarine-200 hover:bg-aquamarine-50 dark:hover:bg-aquamarine-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="
              normalizedCurrentPage() === 1
            " [attr.aria-label]="
              'Chuyển đến trang trước'
            " (click)="
              goToPage(
                normalizedCurrentPage() - 1
              )
            ">
            <i class="bi bi-chevron-left sm:me-1" aria-hidden="true"></i>

            <span class="hidden sm:inline">
              {{ 'pagination.prev' | translate }}
            </span>
          </button>
        </li>

        <!-- Các trang -->
        @for (
        item of pageItems();
        track item.key
        ) {
        @if (item.type === 'page') {
        <li>
          <button type="button" class="min-w-10 min-h-10 px-3 py-2 rounded-lg font-semibold border transition-colors"
            [class.bg-aquamarine-600]="
                  normalizedCurrentPage() ===
                  item.value
                " [class.border-aquamarine-600]="
                  normalizedCurrentPage() ===
                  item.value
                " [class.text-white]="
                  normalizedCurrentPage() ===
                  item.value
                " [class.bg-white]="
                  normalizedCurrentPage() !==
                  item.value
                " [class.dark:bg-black]="
                  normalizedCurrentPage() !==
                  item.value
                " [class.border-aquamarine-200]="
                  normalizedCurrentPage() !==
                  item.value
                " [class.dark:border-aquamarine-800]="
                  normalizedCurrentPage() !==
                  item.value
                " [class.text-aquamarine-800]="
                  normalizedCurrentPage() !==
                  item.value
                " [class.dark:text-aquamarine-200]="
                  normalizedCurrentPage() !==
                  item.value
                " [class.hover:bg-aquamarine-50]="
                  normalizedCurrentPage() !==
                  item.value
                " [class.dark:hover:bg-aquamarine-900]="
                  normalizedCurrentPage() !==
                  item.value
                " [attr.aria-current]="
                  normalizedCurrentPage() ===
                  item.value
                    ? 'page'
                    : null
                " [attr.aria-label]="
                  normalizedCurrentPage() ===
                  item.value
                    ? 'Trang hiện tại, trang ' +
                      item.value
                    : 'Chuyển đến trang ' +
                      item.value
                " (click)="goToItem(item)">
            {{ item.value }}
          </button>
        </li>
        } @else {
        <!-- Dấu ba chấm không phải button -->
        <li aria-hidden="true">
          <span
            class="inline-flex min-w-8 min-h-10 items-center justify-center px-1 text-aquamarine-500 dark:text-aquamarine-400 select-none">
            …
          </span>
        </li>
        }
        }

        <!-- Trang sau -->
        <li>
          <button type="button"
            class="min-h-10 px-3 py-2 rounded-lg border border-aquamarine-200 dark:border-aquamarine-800 bg-white dark:bg-black text-aquamarine-800 dark:text-aquamarine-200 hover:bg-aquamarine-50 dark:hover:bg-aquamarine-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="
              normalizedCurrentPage() ===
              totalPages()
            " [attr.aria-label]="
              'Chuyển đến trang sau'
            " (click)="
              goToPage(
                normalizedCurrentPage() + 1
              )
            ">
            <span class="hidden sm:inline">
              {{ 'pagination.next' | translate }}
            </span>

            <i class="bi bi-chevron-right sm:ms-1" aria-hidden="true"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
