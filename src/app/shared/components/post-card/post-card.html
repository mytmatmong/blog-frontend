<article class="card post-card soft-card mb-3">
  <div class="card-body">
    <div class="d-flex gap-3">
      
      <div class="vote-col text-center d-none d-sm-block">
        <button class="btn btn-light btn-sm like-btn">
          <i class="bi bi-caret-up-fill"></i>
        </button>
        <div class="fw-bold">{{ post.likes }}</div>
        <button class="btn btn-light btn-sm">
          <i class="bi bi-bookmark"></i>
        </button>
      </div>

      <div class="post-thumb d-none d-md-flex justify-content-center align-items-center">
        <i class="bi bi-code-slash fs-2 text-primary"></i>
      </div>

      <div class="flex-grow-1">
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="avatar-sm">{{ post.authorAvatar }}</span>
          <small class="text-muted">{{ post.authorName }} • {{ post.timeAgo }} • {{ post.readTime }}</small>
        </div>

        <div class="mb-2">
          @for (cat of post.categories; track cat) {
            <a routerLink="/category" class="category-badge me-1">{{ cat }}</a>
          }
        </div>

        <h5 class="fw-bold mb-2">
          <a [routerLink]="['/post', post.id]" class="post-title">
            {{ post.title }}
          </a>
        </h5>

        <p class="text-muted mb-3">
          {{ post.excerpt }}
        </p>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
          <div class="d-flex flex-wrap gap-2">
            @for (tag of post.tags; track tag) {
              <a class="tag" routerLink="/hashtag">{{ tag }}</a>
            }
          </div>

          <small class="text-muted">
            <i class="bi bi-eye"></i> {{ post.views }}
            <i class="bi bi-chat ms-2"></i> {{ post.comments }}
          </small>
        </div>
      </div>
      
    </div>
  </div>
</article>
