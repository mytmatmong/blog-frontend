<header class="h-16 bg-white dark:bg-aquamarine-900 border-b border-aquamarine-200 dark:border-aquamarine-800 flex items-center justify-between px-6 sticky top-0 z-10">
  <div>
    <strong class="font-bold text-aquamarine-950 dark:text-aquamarine-50">Dashboard</strong>
    <div class="text-xs text-aquamarine-600 dark:text-aquamarine-400">Bảng điều khiển & Thống kê hệ thống</div>
  </div>
  <div class="flex items-center gap-3">
    <button type="button" class="w-9 h-9 flex items-center justify-center rounded-full border border-aquamarine-200 dark:border-aquamarine-700 hover:scale-105 transition-transform" (click)="auth.toggleTheme()" title="Chuyển chế độ Sáng/Tối">
      @if (auth.isDarkMode()) {
        <i class="bi bi-sun-fill text-yellow-400"></i>
      } @else {
        <i class="bi bi-moon-stars-fill text-aquamarine-600"></i>
      }
    </button>
    <span class="avatar-sm">S</span>
    <button type="button" class="px-3 py-1.5 rounded-lg border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 text-xs font-medium transition-colors" title="Đăng xuất" (click)="auth.setRole('guest')" routerLink="/auth">
      <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
    </button>
  </div>
</header>
