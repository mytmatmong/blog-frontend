<!-- dashboard-header -->
<header class="h-16 bg-[var(--card-bg)] border-b border-[var(--border-color)] flex items-center justify-between px-6 sticky top-0 z-10">
  <!-- dashboard-header-title -->
  <div>
    <strong class="font-bold text-[var(--card-text-default)]">{{ 'dashboard.title' | translate }}</strong>
    <div class="text-xs text-[var(--text-muted)]">{{ 'dashboard.subtitle' | translate }}</div>
  </div>

  <!-- dashboard-header-actions -->
  <div class="flex items-center gap-3">
    <!-- dashboard-header-lang-dropdown -->
    <div class="relative">
      <button type="button" (click)="toggleLangDropdown()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl border border-[var(--border-color)] bg-[var(--card-bg-muted)] text-[var(--card-text-default)] hover:border-[var(--brand)] transition-colors">
        <span class="text-sm">{{ translationService.currentLang() === 'VI' ? '🇻🇳' : '🇬🇧' }}</span>
        <span>{{ translationService.currentLang() }}</span>
        <i class="bi bi-chevron-down text-xs ms-0.5"></i>
      </button>

      @if (isLangDropdownOpen()) {
      <ul class="absolute right-0 mt-1 w-44 bg-[var(--card-bg)] rounded-xl shadow-lg border border-[var(--border-color)] py-1 z-50">
        @for (lang of translationService.languages; track lang.code) {
        <li>
          <button type="button" (click)="selectLang(lang.code)" class="w-full text-left flex items-center gap-2 px-4 py-2 text-xs text-[var(--card-text-default)] hover:bg-[var(--card-bg-muted)]" [class.font-bold]="translationService.currentLang() === lang.code">
            <span class="text-sm">{{ lang.flag }}</span>
            <span>{{ lang.name }}</span>
            @if (translationService.currentLang() === lang.code) {
            <i class="bi bi-check2 ms-auto text-[var(--brand)] font-bold text-sm"></i>
            }
          </button>
        </li>
        }
      </ul>
      }
    </div>

    <!-- theme-toggle -->
    <button type="button" class="w-9 h-9 flex items-center justify-center rounded-full border border-[var(--border-color)] hover:scale-105 transition-transform" (click)="auth.toggleTheme()" [title]="'nav.toggle_theme' | translate">
      @if (auth.isDarkMode()) {
      <i class="bi bi-sun-fill text-yellow-400"></i>
      } @else {
      <i class="bi bi-moon-stars-fill text-[var(--brand)]"></i>
      }
    </button>

    <!-- avatar-badge -->
    <span class="w-8 h-8 grid place-items-center rounded-full bg-[var(--brand)] text-white text-xs font-bold shrink-0">S</span>

    <!-- logout-btn -->
    <button type="button" class="px-3 py-1.5 rounded-lg border border-[color-mix(in_srgb,var(--danger,#dc2626)_30%,var(--border-color))] text-[var(--danger,#dc2626)] hover:bg-[color-mix(in_srgb,var(--danger,#dc2626)_8%,transparent)] text-xs font-medium transition-colors" [title]="'dashboard.logout' | translate" (click)="onLogout()">
      <i class="bi bi-box-arrow-right me-1"></i>{{ 'dashboard.logout' | translate }}
    </button>
  </div>
</header>
