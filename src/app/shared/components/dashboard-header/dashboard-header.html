<header class="h-16 bg-white dark:bg-aquamarine-900 border-b border-aquamarine-200 dark:border-aquamarine-800 flex items-center justify-between px-6 sticky top-0 z-10">
  <div>
    <strong class="font-bold text-aquamarine-950 dark:text-aquamarine-50">{{ 'dashboard.title' | translate }}</strong>
    <div class="text-xs text-aquamarine-600 dark:text-aquamarine-400">{{ 'dashboard.subtitle' | translate }}</div>
  </div>
  <div class="flex items-center gap-3">
    <!-- Language Selector Dropdown -->
    <div class="relative">
      <button type="button" 
        (click)="toggleLangDropdown()"
        class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl border border-aquamarine-200 dark:border-aquamarine-800 bg-aquamarine-50 dark:bg-aquamarine-950 text-aquamarine-950 dark:text-aquamarine-100 hover:bg-aquamarine-100 dark:hover:bg-aquamarine-900 transition-colors">
        <span class="text-sm">{{ translationService.currentLang() === 'VI' ? '🇻🇳' : '🇬🇧' }}</span>
        <span>{{ translationService.currentLang() }}</span>
        <i class="bi bi-chevron-down text-xs ms-0.5"></i>
      </button>

      @if (isLangDropdownOpen()) {
        <ul class="absolute right-0 mt-1 w-44 bg-white dark:bg-aquamarine-900 rounded-xl shadow-lg border border-aquamarine-200 dark:border-aquamarine-800 py-1 z-50">
          @for (lang of translationService.languages; track lang.code) {
            <li>
              <button type="button" (click)="selectLang(lang.code)" class="w-full text-left flex items-center gap-2 px-4 py-2 text-xs text-aquamarine-800 dark:text-aquamarine-100 hover:bg-aquamarine-50 dark:hover:bg-aquamarine-800" [class.font-bold]="translationService.currentLang() === lang.code">
                <span class="text-sm">{{ lang.flag }}</span>
                <span>{{ lang.name }}</span>
                @if (translationService.currentLang() === lang.code) {
                  <i class="bi bi-check2 ms-auto text-aquamarine-600 dark:text-aquamarine-400 font-bold text-sm"></i>
                }
              </button>
            </li>
          }
        </ul>
      }
    </div>

    <button type="button" class="w-9 h-9 flex items-center justify-center rounded-full border border-aquamarine-200 dark:border-aquamarine-700 hover:scale-105 transition-transform" (click)="auth.toggleTheme()" [title]="'nav.toggle_theme' | translate">
      @if (auth.isDarkMode()) {
        <i class="bi bi-sun-fill text-yellow-400"></i>
      } @else {
        <i class="bi bi-moon-stars-fill text-aquamarine-600"></i>
      }
    </button>
    <span class="avatar-sm">S</span>
    <button type="button" class="px-3 py-1.5 rounded-lg border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 text-xs font-medium transition-colors" [title]="'dashboard.logout' | translate" (click)="auth.setRole('guest')" routerLink="/auth">
      <i class="bi bi-box-arrow-right me-1"></i>{{ 'dashboard.logout' | translate }}
    </button>
  </div>
</header>
