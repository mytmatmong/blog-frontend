<!-- dashboard-header -->
<header class="h-16 bg-[var(--card-bg)] border-b border-[var(--border-color)] flex items-center justify-between px-6 sticky top-0 z-10">
  <!-- dashboard-header-title -->
  <div>
    <strong class="font-bold text-[var(--card-text-default)]">{{ 'dashboard.title' | translate }}</strong>
    <div class="text-xs text-[var(--text-muted)]">{{ 'dashboard.subtitle' | translate }}</div>
  </div>

  <!-- dashboard-header-actions -->
  <div class="flex items-center gap-3">
    <!-- dashboard-header-lang-dropdown -->
    <div class="relative">
      <app-language-selector mode="system" size="sm" [hideCode]="true" />
    </div>

    <!-- theme-toggle -->
    <button type="button" class="w-9 h-9 flex items-center justify-center rounded-full border border-[var(--border-color)] hover:scale-105 transition-transform" (click)="auth.toggleTheme()" [title]="'nav.toggle_theme' | translate">
      @if (auth.isDarkMode()) {
      <i class="bi bi-sun-fill text-yellow-400"></i>
      } @else {
      <i class="bi bi-moon-stars-fill text-[var(--brand)]"></i>
      }
    </button>

    <!-- avatar-badge -->
    <span
      class="w-8 h-8 grid place-items-center overflow-hidden rounded-full bg-[var(--brand)] text-white text-xs font-bold shrink-0"
      [title]="auth.currentUser()?.username || auth.currentUser()?.email || ''"
    >
      @if (auth.currentUser()?.avatarUrl; as avatarUrl) {
      <img
        class="w-full h-full object-cover"
        [src]="avatarUrl"
        [alt]="auth.currentUser()?.username || 'Avatar'"
      >
      } @else {
      {{ userInitial() }}
      }
    </span>

    <!-- logout-btn -->
    <button type="button" class="px-3 py-1.5 rounded-lg border border-[color-mix(in_srgb,var(--danger,#dc2626)_30%,var(--border-color))] text-[var(--danger,#dc2626)] hover:bg-[color-mix(in_srgb,var(--danger,#dc2626)_8%,transparent)] text-xs font-medium transition-colors" [title]="'dashboard.logout' | translate" (click)="onLogout()">
      <i class="bi bi-box-arrow-right me-1"></i>{{ 'dashboard.logout' | translate }}
    </button>
  </div>
</header>
